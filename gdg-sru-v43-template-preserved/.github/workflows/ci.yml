name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Pages Build
        run: python scripts/build-pages.py --check

      - name: Verify CSS Compilation
        run: python scripts/build-css.py

      - name: Verify JavaScript Syntax
        run: |
          node --check site/config.js
          node --check site/assets/js/*.js
          node --check site/assets/admin/*.js
